<!doctype html>
<html lang="ko" class="notranslate">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" class="notranslate" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="google" content="notranslate" />
    <title>초등 길이 단위 대탐험</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Jua&family=Nanum+Square+Round:wght@700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css" />

    <style>
      :root {
        --font-family: 'Nanum Square Round', 'Jua', 'Pretendard', sans-serif;
        --bg-gradient: linear-gradient(135deg, #f0f7ff 0%, #eef2ff 50%, #fef3c7 100%);
        --primary-color: #4f46e5;
        --radius-lg: 24px;
        --radius-md: 18px;
      }

      * {
        box-sizing: border-box !important;
        margin: 0;
        padding: 0;
      }

      body {
        font-family: var(--font-family) !important;
        background: var(--bg-gradient) !important;
        color: #1e293b !important;
        min-height: 100vh;
        overflow-x: hidden;
      }

      button, input, select, textarea {
        font-family: var(--font-family) !important;
        -webkit-appearance: none !important;
        appearance: none !important;
        outline: none !important;
      }

      /* 헤더 */
      .main-header {
        position: sticky;
        top: 0;
        z-index: 100;
        padding: 14px 24px;
        background: rgba(255, 255, 255, 0.96) !important;
        backdrop-filter: blur(12px) !important;
        border-bottom: 1px solid rgba(99, 102, 241, 0.12) !important;
      }

      .header-container {
        max-width: 1080px;
        margin: 0 auto;
        display: flex !important;
        align-items: center !important;
        justify-content: space-between !important;
      }

      .nav-menu {
        display: flex !important;
        gap: 6px !important;
        background: #f1f5f9 !important;
        padding: 5px !important;
        border-radius: 16px !important;
      }

      .nav-item {
        display: flex !important;
        align-items: center !important;
        gap: 6px !important;
        padding: 8px 16px !important;
        border: none !important;
        background: transparent !important;
        color: #64748b !important;
        font-weight: 800 !important;
        font-size: 15px !important;
        border-radius: 12px !important;
        cursor: pointer !important;
      }

      .nav-item.active {
        color: #ffffff !important;
        background: #4f46e5 !important;
        box-shadow: 0 4px 12px rgba(79, 70, 229, 0.3) !important;
      }

      /* 미니게임 인게임 퀴즈 카드 & 2x2 그리드 강제 보장 */
      .game-container {
        max-width: 800px !important;
        margin: 0 auto !important;
        display: flex !important;
        flex-direction: column !important;
        gap: 20px !important;
      }

      .game-header-card {
        padding: 28px 32px !important;
        background: #ffffff !important;
        border: 2px solid #e0e7ff !important;
        border-radius: 24px !important;
        box-shadow: 0 10px 25px rgba(99, 102, 241, 0.08) !important;
        display: flex !important;
        flex-direction: column !important;
        gap: 10px !important;
      }

      .game-play-area {
        display: flex !important;
        flex-direction: column !important;
        gap: 20px !important;
      }

      .game-status-bar {
        display: flex !important;
        justify-content: space-around !important;
        align-items: center !important;
        background: #ffffff !important;
        padding: 16px 24px !important;
        border-radius: 20px !important;
        border: 2px solid #e0e7ff !important;
        box-shadow: 0 8px 20px rgba(0,0,0,0.04) !important;
      }

      .quiz-card {
        padding: 36px 28px !important;
        text-align: center !important;
        background: #ffffff !important;
        border: 2px solid #e0e7ff !important;
        border-radius: 28px !important;
        box-shadow: 0 15px 35px rgba(99, 102, 241, 0.12) !important;
      }

      .prompt-text {
        font-size: 44px !important;
        font-weight: 900 !important;
        color: #1e1b4b !important;
        margin: 16px 0 28px !important;
      }

      /* 2x2 정답 선택지 버튼 그리드 (핵심!!) */
      .options-grid {
        display: grid !important;
        grid-template-columns: 1fr 1fr !important;
        gap: 16px !important;
        width: 100% !important;
        margin-top: 20px !important;
      }

      .option-btn {
        padding: 22px 16px !important;
        font-size: 24px !important;
        font-weight: 900 !important;
        background: #ffffff !important;
        border: 3px solid #cbd5e1 !important;
        border-radius: 20px !important;
        color: #0f172a !important;
        box-shadow: 0 6px 16px rgba(0, 0, 0, 0.06) !important;
        cursor: pointer !important;
        display: flex !important;
        align-items: center !important;
        justify-content: center !important;
        transition: transform 0.15s ease !important;
      }

      .option-btn:hover {
        border-color: #4f46e5 !important;
        background: #f5f3ff !important;
        transform: translateY(-2px) !important;
      }
    </style>
  </head>
  <body class="notranslate">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
